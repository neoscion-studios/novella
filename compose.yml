name: novella

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=false
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=novella_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certificates:/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 30s
      timeout: 5s
      retries: 3

  novella:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      ELEVENLABS_ENABLE_LOGGING: ${ELEVENLABS_ENABLE_LOGGING:-false}
      PROOFREADING_ENABLED: ${PROOFREADING_ENABLED:-true}
      PROOFREADING_URL: ${PROOFREADING_URL:-http://languagetool:8010}
      PROOFREADING_TIMEOUT_MS: ${PROOFREADING_TIMEOUT_MS:-8000}
      PROOFREADING_LANGUAGE: ${PROOFREADING_LANGUAGE:-en-US}
      PROOFREADING_MAX_CONCURRENT: ${PROOFREADING_MAX_CONCURRENT:-2}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_FILE: ${DATABASE_FILE:-/app/data/novella.sqlite}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID in .env}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID in .env}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?Set ENTRA_CLIENT_SECRET in .env}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:?Set ENTRA_REDIRECT_URI in .env}
      ENTRA_POST_LOGOUT_REDIRECT_URI: ${ENTRA_POST_LOGOUT_REDIRECT_URI:?Set ENTRA_POST_LOGOUT_REDIRECT_URI in .env}
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - proxy
      - proofreading
    labels:
      traefik.enable: "true"
      traefik.docker.network: novella_proxy
      traefik.http.services.novella.loadbalancer.server.port: "4173"
      traefik.http.routers.novella.rule: Host(`${NOVELLA_HOST:?Set NOVELLA_HOST in .env}`)
      traefik.http.routers.novella.entrypoints: websecure
      traefik.http.routers.novella.priority: "10"
      traefik.http.routers.novella.tls: "true"
      traefik.http.routers.novella.tls.certresolver: letsencrypt
      traefik.http.routers.novella.service: novella
      traefik.http.routers.novella.middlewares: security-headers@docker

      traefik.http.middlewares.security-headers.headers.stsseconds: "31536000"
      traefik.http.middlewares.security-headers.headers.contenttypenosniff: "true"
      traefik.http.middlewares.security-headers.headers.framedeny: "true"
      traefik.http.middlewares.security-headers.headers.referrerpolicy: no-referrer
      traefik.http.middlewares.security-headers.headers.permissionspolicy: camera=(), microphone=(), geolocation=()

  languagetool:
    image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      Java_Xms: ${LANGUAGETOOL_JAVA_XMS:-256m}
      Java_Xmx: ${LANGUAGETOOL_JAVA_XMX:-512m}
    volumes:
      - ./deployment/languagetool-logback.xml:/LanguageTool/logback.xml:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - proofreading
    mem_limit: ${LANGUAGETOOL_MEMORY_LIMIT:-768m}
    cpus: ${LANGUAGETOOL_CPU_LIMIT:-1.0}
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --data, language=en-US&text=health, http://localhost:8010/v2/check]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

networks:
  proxy:
    name: novella_proxy
  proofreading:
    name: novella_proofreading
    internal: true

volumes:
  traefik_certificates:
