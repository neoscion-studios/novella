<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Novella — a local-first workspace for writing stories." />
    <title>Novella</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Novella home">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>Novella</span>
        </a>
        <nav class="primary-nav" aria-label="Workspace">
          <button class="nav-item active" data-view="manuscript">Manuscript</button>
          <button class="nav-item" data-view="characters">Characters</button>
          <button class="nav-item" data-view="locations">Locations</button>
        </nav>
        <div class="top-actions">
          <div id="authInfo" class="auth-info" hidden>
            <span id="authUser" class="auth-user"></span>
            <form action="/logout" method="post">
              <input id="csrfToken" type="hidden" name="csrfToken" value="" />
              <button class="logout-button" type="submit">Sign out</button>
            </form>
          </div>
          <span id="saveStatus" class="save-status"><span class="status-dot"></span> Saved</span>
        </div>
      </header>

      <main id="app" class="workspace" aria-live="polite">
        <div class="loading-state"><span class="loader"></span> Opening your manuscript…</div>
      </main>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <input id="projectImportFile" type="file" accept=".json,application/json" hidden />
    <dialog id="confirmDialog" class="dialog">
      <form method="dialog">
        <div class="dialog-icon">!</div>
        <h2 id="confirmTitle">Delete this item?</h2>
        <p id="confirmMessage">This cannot be undone.</p>
        <div class="dialog-actions">
          <button value="cancel" class="button secondary">Keep it</button>
          <button value="confirm" class="button danger">Delete</button>
        </div>
      </form>
    </dialog>
    <dialog id="projectSettingsDialog" class="dialog project-settings-dialog" aria-labelledby="projectSettingsTitle">
      <form method="dialog">
        <div class="settings-heading">
          <div>
            <p class="eyebrow">Current novel</p>
            <h2 id="projectSettingsTitle">Project Settings</h2>
          </div>
          <button class="icon-button settings-close" value="close" aria-label="Close Project Settings">×</button>
        </div>
        <section class="settings-section" aria-labelledby="projectInformationHeading">
          <h3 id="projectInformationHeading">Project Information</h3>
          <dl class="project-information">
            <div><dt>Title</dt><dd id="settingsProjectTitle"></dd></div>
            <div><dt>Author</dt><dd id="settingsProjectAuthor"></dd></div>
          </dl>
        </section>
        <section class="settings-section" aria-labelledby="projectExportHeading">
          <h3 id="projectExportHeading">Export</h3>
          <div class="settings-actions">
            <button class="button" type="button" data-export-manuscript>Export Manuscript (.md)</button>
            <button class="button secondary" type="button" data-export-project>Export Project (.json)</button>
          </div>
        </section>
        <section class="settings-section" aria-labelledby="projectImportHeading">
          <h3 id="projectImportHeading">Import</h3>
          <div class="settings-actions">
            <button class="button secondary" type="button" data-import-project>Import Project (.json)</button>
          </div>
        </section>
      </form>
    </dialog>
    <dialog id="importDialog" class="dialog import-dialog">
      <form method="dialog">
        <div class="dialog-icon import-icon">↥</div>
        <h2>Import as a new novel?</h2>
        <p id="importSummary">Review the project before importing it.</p>
        <div class="dialog-actions">
          <button value="cancel" class="button secondary">Cancel</button>
          <button value="confirm" class="button">Import new novel</button>
        </div>
      </form>
    </dialog>
    <script src="/markdown.js" defer></script>
    <script src="/proofreading.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
